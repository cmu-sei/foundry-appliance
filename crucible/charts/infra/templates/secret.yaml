{{- /* ================================================================== */ -}}
{{- /* Infrastructure secrets — PostgreSQL, pgAdmin, Gitea admin         */ -}}
{{- /* Application-level secrets (OIDC, realm, per-app) are created by   */ -}}
{{- /* the upstream sei/crucible chart when createRealm is enabled.       */ -}}
{{- /* ================================================================== */ -}}

{{- /* PostgreSQL password */ -}}
{{- $postgresPassword := randAlphaNum 16 -}}
{{- $postgresqlSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-postgresql" (include "infra.fullname" .)) -}}
{{- if and $postgresqlSecret (hasKey $postgresqlSecret.data "postgres-password") -}}
  {{- $postgresPassword = index $postgresqlSecret.data "postgres-password" | b64dec -}}
{{- end }}

{{- /* pgAdmin password */ -}}
{{- $pgadminPassword := randAlphaNum 16 -}}
{{- $pgadminSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-pgadmin" (include "infra.fullname" .)) -}}
{{- if and $pgadminSecret (hasKey $pgadminSecret.data "password") -}}
  {{- $pgadminPassword = index $pgadminSecret.data "password" | b64dec -}}
{{- end }}

{{- /* Gitea admin password */ -}}
{{- $giteaAdminPassword := randAlphaNum 16 -}}
{{- $giteaAdminSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-gitea-admin" (include "infra.fullname" .)) -}}
{{- if and $giteaAdminSecret (hasKey $giteaAdminSecret.data "admin-password") -}}
  {{- $giteaAdminPassword = (index $giteaAdminSecret.data "admin-password" | b64dec) -}}
{{- end }}

{{- /* ================================================================== */ -}}
{{- /* PostgreSQL Secret                                                  */ -}}
{{- /* ================================================================== */ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "infra.fullname" . }}-postgresql
  labels:
    {{- include "infra.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  postgres-password: {{ $postgresPassword }}
  username: postgres

---
{{- /* ================================================================== */ -}}
{{- /* pgAdmin Secret                                                     */ -}}
{{- /* ================================================================== */ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "infra.fullname" . }}-pgadmin
  labels:
    {{- include "infra.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  password: {{ $pgadminPassword }}

---
{{- /* ================================================================== */ -}}
{{- /* Gitea Admin Secret                                                 */ -}}
{{- /* ================================================================== */ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "infra.fullname" . }}-gitea-admin
  labels:
    {{- include "infra.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  admin-password: {{ $giteaAdminPassword }}
