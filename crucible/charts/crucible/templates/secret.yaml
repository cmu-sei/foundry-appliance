{{- /* Persist postgres account password on a chart reinstall */ -}}
{{- $postgresPassword := "" }}
{{- $postgresqlSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-postgresql" (include "crucible.fullname" .)) }}
{{- if $postgresqlSecret }}
{{-   $postgresPassword = index $postgresqlSecret.data "postgres-password" | b64dec }}
{{- else }}
{{-   $postgresPassword = randAlphaNum 16 }}
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "crucible.fullname" . }}-postgresql
  labels:
    {{- include "crucible.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  postgres-password: {{ $postgresPassword | b64enc | quote }}

---
{{- $giteaSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-gitea-admin-secret" (include "crucible.fullname" .)) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "crucible.fullname" . }}-gitea-admin-secret
  labels:
    {{- include "crucible.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  admin-password: {{ if $giteaSecret }}{{ index $giteaSecret.data "admin-password" }}{{ else }}{{ randAlphaNum 16 | b64enc | quote }}{{ end }}


---
{{- $keycloakSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-keycloak-auth" (include "crucible.fullname" .)) -}}
{{- $keycloakAdminPassword := randAlphaNum 16 -}}
{{- $keycloakOauthClientSecret := (randBytes 16 | b64dec | printf "%032x") -}}
{{- $keycloakCrucibleUserGuid := uuidv4 -}}

{{- if and $keycloakSecret (hasKey $keycloakSecret.data "admin-password") -}}
  {{- $keycloakAdminPassword = (index $keycloakSecret.data "admin-password" | b64dec) -}}
{{- end }}
{{- if and $keycloakSecret (hasKey $keycloakSecret.data "oauth-client-secret") -}}
  {{- $keycloakOauthClientSecret = (index $keycloakSecret.data "oauth-client-secret" | b64dec) -}}
{{- end }}
{{- if and $keycloakSecret (hasKey $keycloakSecret.data "crucible-user-guid") -}}
  {{- $keycloakCrucibleUserGuid = (index $keycloakSecret.data "crucible-user-guid" | b64dec) -}}
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "crucible.fullname" . }}-keycloak-auth
  labels:
    {{- include "crucible.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  admin-password: {{ $keycloakAdminPassword }}
  oauth-client-secret: {{ $keycloakOauthClientSecret }}
  crucible-user-guid: {{ $keycloakCrucibleUserGuid }}

---
{{- /* TODO: Share oauth-client-secret and move this back to configmap.yaml */ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "crucible.fullname" . }}-keycloak-config-cli
  labels:
    {{- include "crucible.labels" . | nindent 4 }}
data:
  realm.json: |
    {
      "realm": "crucible",
      "enabled": true,
      "clientScopes": [
        {
          "name": "topomojo-api",
          "description": "TopoMojo API",
          "protocol": "openid-connect",
          "attributes": {
            "include.in.token.scope": "true",
            "display.on.consent.screen": "true"
          },
          "protocolMappers": [
            {
              "name": "audiences",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.client.audience": "topomojo-api",
                "id.token.claim": "false",
                "access.token.claim": "true"
              }
            },
            {
              "name": "subject",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-sub-mapper",
              "consentRequired": false,
              "config": {
                "access.token.claim": "true",
                "id.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            }
          ]
        },
        {
          "name": "gameboard-api",
          "description": "Gameboard API",
          "protocol": "openid-connect",
          "attributes": {
            "include.in.token.scope": "true",
            "display.on.consent.screen": "true"
          },
          "protocolMappers": [
            {
              "name": "audiences",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.client.audience": "gameboard-api",
                "id.token.claim": "false",
                "access.token.claim": "true"
              }
            },
            {
              "name": "subject",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-sub-mapper",
              "consentRequired": false,
              "config": {
                "access.token.claim": "true",
                "id.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            }
          ]
        }
      ],
      "clients": [
        {
          "clientId": "topomojo-client",
          "name": "TopoMojo",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": true,
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "redirectUris": [
            "/oidc",
            "/oidc-silent.html"
          ],
          "rootUrl": "https://{{ .Values.global.domain }}/topomojo",
          "baseUrl": "/",
          "defaultClientScopes": ["profile", "topomojo-api"],
          "attributes": {
            "pkce.code.challenge.method": "S256"
          }
        },
        {
          "clientId": "topomojo-swagger",
          "name": "TopoMojo Swagger",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": true,
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "redirectUris": ["/oauth2-redirect.html"],
          "rootUrl": "https://{{ .Values.global.domain }}/topomojo/api",
          "baseUrl": "/",
          "defaultClientScopes": ["topomojo-api"],
          "attributes": {
            "consent.required": "true"
          }
        },
        {
          "clientId": "gameboard-client",
          "name": "Gameboard",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": true,
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "redirectUris": [
            "/oidc",
            "/oidc-silent.html"
          ],
          "rootUrl": "https://{{ .Values.global.domain }}/gameboard",
          "baseUrl": "/",
          "defaultClientScopes": ["profile", "gameboard-api"],
          "attributes": {
            "pkce.code.challenge.method": "S256"
          }
        },
        {
          "clientId": "gameboard-swagger",
          "name": "Gameboard Swagger",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": true,
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "redirectUris": [
            "/oauth2-redirect.html"
          ],
          "rootUrl": "https://{{ .Values.global.domain }}/gameboard/api",
          "baseUrl": "/",
          "defaultClientScopes": ["gameboard-api"],
          "attributes": {
            "consent.required": "true"
          }
        },
        {
          "clientId": "gitea-client",
          "name": "Gitea",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "{{ $keycloakOauthClientSecret }}",
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": false,
          "implicitFlowEnabled": false,
          "redirectUris": [
            "/user/oauth2/Crucible/callback"
          ],
          "rootUrl": "https://{{ .Values.global.domain }}/gitea",
          "baseUrl": "/",
          "defaultClientScopes": ["profile", "email"],
          "attributes": {
            "oauth2.device.authorization.grant.enabled": "false"
          }
        }
      ],
      "roles": {
        "realm": [
          {
            "name": "crucible-admin",
            "description": "Administrator role for the Crucible realm",
            "composite": true,
            "composites": {
              "client": {
                "realm-management": [
                  "realm-admin"
                ]
              }
            }
          }
        ]
      }
    }

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "crucible.fullname" $ }}-topomojo-api-custom
  labels:
    {{- include "crucible.labels" $ | nindent 4 }}
type: Opaque
stringData:
  appsettings.conf: |
    Database__ConnectionString = Server={{ include "crucible.fullname" $ }}-postgresql;Port=5432;Database=topomojo;Username=postgres;Password={{ $postgresPassword }};SSL Mode=Prefer;Trust Server Certificate=true;
    Database__AdminId = {{ $keycloakCrucibleUserGuid }}
  cacert.crt: |
    {{- index (lookup "v1" "Secret" .Release.Namespace (printf "%s-ca" .Values.global.infraHelmRelease)).data "ca.crt" | b64dec | nindent 4 }}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "crucible.fullname" $ }}-gameboard-api-custom
  labels:
    {{- include "crucible.labels" $ | nindent 4 }}
type: Opaque
stringData:
  Database__ConnectionString: Server={{ include "crucible.fullname" $ }}-postgresql;Port=5432;Database=gameboard;Username=postgres;Password={{ $postgresPassword }};SSL Mode=Prefer;Trust Server Certificate=true;
  Database__AdminId: {{ $keycloakCrucibleUserGuid }}
