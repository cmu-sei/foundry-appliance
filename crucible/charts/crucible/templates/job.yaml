{{- /* ================================================================== */ -}}
{{- /* Configure Gitea OIDC                                                */ -}}
{{- /* ================================================================== */ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-add-oidc
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "15"
spec:
  template:
    spec:
      restartPolicy: OnFailure
      volumes:
        - name: gitea-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-gitea
        - name: ca-cert
          secret:
            defaultMode: 420
            secretName: infra-ca
      containers:
        - name: gitea-cli
          image: {{ include "crucible-local.gitea.image" . }}
          volumeMounts:
            - name: gitea-data
              mountPath: /bitnami/gitea
              readOnly: true
            - name: ca-cert
              mountPath: /etc/ssl/certs/ca-cert.crt
              readOnly: true
              subPath: ca.crt
          env:
            - name: GITEA_APP_INI
              value: /bitnami/gitea/custom/conf/app.ini
            - name: GITEA_WORK_DIR
              value: /bitnami/gitea
            - name: GITEA_ADMIN_USERNAME
              value: {{ .Values.gitea.adminUsername }}
            - name: GITEA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: infra-gitea-admin
                  key: admin-password
            - name: OIDC_CLIENT_ID
              value: gitea-client
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-gitea-oidc
                  key: client-secret
          command:
            - /bin/bash
            - -eu
            - -c
            - |
              if /opt/bitnami/gitea/bin/gitea admin auth list | grep -q "Crucible"; then
                  echo "OAuth auth source 'Crucible' already exists, skipping creation"
                  exit 0
              fi

              /opt/bitnami/gitea/bin/gitea admin auth add-oauth \
                  --name "Crucible" \
                  --provider openidConnect \
                  --key "$OIDC_CLIENT_ID" \
                  --secret "$OIDC_CLIENT_SECRET" \
                  --auto-discover-url "https://{{ .Values.global.domain }}/keycloak/realms/crucible/.well-known/openid-configuration" \
                  --scopes "openid profile email" \

---
{{- /* ================================================================== */ -}}
{{- /* Seed Gitea with MkDocs repository                                   */ -}}
{{- /* ================================================================== */ -}}
{{- $files := .Files.Glob "files/mkdocs/**" -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-seed-mkdocs
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: git
          image: alpine/git:latest
          command: ["/bin/sh","-c"]
          args: ["/scripts/seed-gitea.sh"]
          env:
            - name: GITEA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: infra-gitea-admin
                  key: admin-password
          volumeMounts:
            - name: mkdocs
              mountPath: /mkdocs
            - name: script
              mountPath: /scripts
            - name: crucible-ca-cert
              mountPath: /crucible-ca
              readOnly: true
      volumes:
        - name: mkdocs
          configMap:
            name: {{ .Release.Name }}-mkdocs-files
            items:
            {{- range $path, $_ := $files }}
              - key: {{ replace "/" "__" $path | quote }}
                path: {{ (trimPrefix "files/mkdocs/" $path) | quote }}
            {{- end }}
        - name: script
          configMap:
            name: {{ .Release.Name }}-gitea-job-script
            defaultMode: 0755
        - name: crucible-ca-cert
          secret:
            secretName: infra-ca
            items:
            - key: ca.crt
              path: ca.crt

---
{{- /* ================================================================== */ -}}
{{- /* Keycloak post-install setup:                                        */ -}}
{{- /*   1. Create default crucible user (with crucible-user-guid)         */ -}}
{{- /*   2. Register gitea-client (not in the upstream realm)              */ -}}
{{- /* ================================================================== */ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-keycloak-setup
  annotations:
    helm.sh/hook: post-install
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "20"
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: curl
          image: alpine/curl:latest
          env:
            - name: KEYCLOAK_ADMIN_USER
              value: keycloak-admin
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-keycloak-auth
                  key: admin-password
            - name: KEYCLOAK_URL
              value: "http://{{ .Release.Name }}-keycloak:80/keycloak"
            - name: KEYCLOAK_CRUCIBLE_USER_GUID
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-keycloak-auth
                  key: default-user-guid
            - name: GITEA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-gitea-oidc
                  key: client-secret
            - name: DOMAIN
              value: "{{ .Values.global.domain }}"
          command:
            - /bin/sh
            - -c
            - |
              set -e

              echo "Waiting for Keycloak to be ready..."
              until curl -sfk "${KEYCLOAK_URL}/realms/master" > /dev/null 2>&1; do
                echo "Keycloak not ready, waiting 10 seconds..."
                sleep 10
              done
              echo "Keycloak is ready!"

              echo "Getting admin access token..."
              ACCESS_TOKEN=$(curl -sk -X POST \
                "${KEYCLOAK_URL}/realms/master/protocol/openid-connect/token" \
                -H "Content-Type: application/x-www-form-urlencoded" \
                -d "grant_type=password" \
                -d "client_id=admin-cli" \
                -d "username=${KEYCLOAK_ADMIN_USER}" \
                -d "password=${KEYCLOAK_ADMIN_PASSWORD}" | \
                grep -o '"access_token":"[^"]*' | \
                grep -o '[^"]*$')

              echo "Searching for existing user 'crucible'..."
              USERS_JSON=$(curl -sk -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                "${KEYCLOAK_URL}/admin/realms/crucible/users?username=crucible")

              NOW_MS=$(( $(date +%s) * 1000 ))

              if echo "${USERS_JSON}" | grep -q '"id"'; then
                echo "User 'crucible' already exists, skipping import."
              else
                echo "User 'crucible' not found, importing now..."
                curl -k -X POST \
                  "${KEYCLOAK_URL}/admin/realms/crucible/partialImport" \
                  -H "Content-Type: application/json" \
                  -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                  -d '{
                    "users": [
                      {
                        "id": "'"${KEYCLOAK_CRUCIBLE_USER_GUID}"'",
                        "username": "crucible",
                        "email": "administrator@crucible.local",
                        "firstName": "Crucible",
                        "lastName": "Administrator",
                        "enabled": true,
                        "createdTimestamp": "'"${NOW_MS}"'",
                        "credentials": [
                          {
                            "type": "password",
                            "value": "crucible",
                            "userLabel": "initial",
                            "temporary": true
                          }
                        ],
                        "requiredActions":["UPDATE_PASSWORD"],
                        "realmRoles": ["crucible-admin"]
                      }
                    ]
                  }'
              fi

              # Register Gitea as an OIDC client in Keycloak (not included in upstream realm)
              echo "Checking for gitea-client in Keycloak..."
              CLIENTS_JSON=$(curl -sk -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                "${KEYCLOAK_URL}/admin/realms/crucible/clients?clientId=gitea-client")

              if echo "${CLIENTS_JSON}" | grep -q '"id"'; then
                echo "Client 'gitea-client' already exists, skipping creation."
              else
                echo "Creating 'gitea-client' in Keycloak..."
                curl -k -X POST \
                  "${KEYCLOAK_URL}/admin/realms/crucible/clients" \
                  -H "Content-Type: application/json" \
                  -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                  -d '{
                    "clientId": "gitea-client",
                    "secret": "'"${GITEA_CLIENT_SECRET}"'",
                    "enabled": true,
                    "clientAuthenticatorType": "client-secret",
                    "protocol": "openid-connect",
                    "redirectUris": ["https://'"${DOMAIN}"'/gitea/*"],
                    "webOrigins": ["https://'"${DOMAIN}"'"],
                    "standardFlowEnabled": true,
                    "directAccessGrantsEnabled": false,
                    "publicClient": false
                  }'
                echo "Client 'gitea-client' created."
              fi
