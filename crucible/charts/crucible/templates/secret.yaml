{{- /* ================================================================== */ -}}
{{- /* Gitea OIDC client secret — not included in the upstream           */ -}}
{{- /* sei/crucible realm, so we generate and persist it here.           */ -}}
{{- /* ================================================================== */ -}}
{{- $giteaClientSecret := (randAlphaNum 32) -}}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-gitea-oidc" .Release.Name) -}}
{{- if and $existingSecret (hasKey $existingSecret.data "client-secret") -}}
  {{- $giteaClientSecret = (index $existingSecret.data "client-secret" | b64dec) -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-gitea-oidc
  labels:
    {{- include "crucible-local.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  client-secret: {{ $giteaClientSecret }}
