apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-add-oidc
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "15"
spec:
  template:
    spec:
      restartPolicy: OnFailure
      volumes:
        - name: gitea-data
          persistentVolumeClaim:
            claimName: {{ include "crucible.fullname" . }}-gitea
        - name: ca-cert
          secret:
            defaultMode: 420
            secretName: {{ .Values.global.infraHelmRelease }}-ca
      containers:
        - name: gitea-cli
          image: {{ include "crucible.gitea.image" . }}
          volumeMounts:
            - name: gitea-data
              mountPath: /bitnami/gitea
              readOnly: true
            - name: ca-cert
              mountPath: /etc/ssl/certs/ca-cert.crt
              readOnly: true
              subPath: ca.crt
          env:
            - name: GITEA_APP_INI
              value: /bitnami/gitea/custom/conf/app.ini
            - name: GITEA_WORK_DIR
              value: /bitnami/gitea
            - name: GITEA_ADMIN_USERNAME
              value: {{ .Values.gitea.adminUsername }}
            - name: GITEA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "crucible.fullname" . }}-gitea-admin-secret
                  key: admin-password
            - name: OIDC_CLIENT_ID
              value: gitea-client
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "crucible.fullname" . }}-keycloak-auth
                  key: oauth-client-secret
          command:
            - /bin/bash
            - -eu
            - -c
            - |
              if /opt/bitnami/gitea/bin/gitea admin auth list | grep -q "Crucible"; then
                  echo "OAuth auth source 'Crucible' already exists, skipping creation"
                  exit 0
              fi

              /opt/bitnami/gitea/bin/gitea admin auth add-oauth \
                  --name "Crucible" \
                  --provider openidConnect \
                  --key "$OIDC_CLIENT_ID" \
                  --secret "$OIDC_CLIENT_SECRET" \
                  --auto-discover-url "https://{{ .Values.global.domain }}/keycloak/realms/crucible/.well-known/openid-configuration" \
                  --scopes "openid profile email" \

---
{{- /* Job to seed gitea repository with mkdocs files */ -}}
{{- $files := .Files.Glob "files/mkdocs/**" -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "crucible.fullname" . }}-seed-mkdocs
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: git
          image: alpine/git:latest
          command: ["/bin/sh","-c"]
          args: ["/scripts/seed-gitea.sh"]
          env:
            - name: GITEA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "crucible.fullname" . }}-gitea-admin-secret
                  key: admin-password
          volumeMounts:
            - name: mkdocs
              mountPath: /mkdocs
            - name: script
              mountPath: /scripts
            - name: crucible-ca-cert
              mountPath: /crucible-ca
              readOnly: true
      volumes:
        - name: mkdocs
          configMap:
            name: {{ include "crucible.fullname" . }}-mkdocs-files
            items:
            {{- range $path, $_ := $files }}
              - key: {{ replace "/" "__" $path | quote }}
                path: {{ (trimPrefix "files/mkdocs/" $path) | quote }}   # remove parent directories
            {{- end }}
        - name: script
          configMap:
            name: {{ include "crucible.fullname" . }}-gitea-job-script
            defaultMode: 0755
        - name: crucible-ca-cert
          secret:
            secretName: {{ .Values.global.infraHelmRelease }}-ca
            items:
            - key: ca.crt
              path: ca.crt

---
{{- /* Add crucible user to realm of the same name */ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "crucible.fullname" . }}-add-crucible-user
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "10"
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: curl
          image: alpine/curl:latest
          env:
            - name: KEYCLOAK_ADMIN_USER
              value: {{ .Values.keycloak.auth.adminUser }}
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "crucible.fullname" . }}-keycloak-auth
                  key: admin-password
            - name: KEYCLOAK_URL
              value: https://{{ .Values.global.domain }}/keycloak
            - name: KEYCLOAK_CRUCIBLE_USER_GUID
              valueFrom:
                secretKeyRef:
                  name: {{ include "crucible.fullname" . }}-keycloak-auth
                  key: crucible-user-guid
            - name: KEYCLOAK_CRUCIBLE_USERNAME
              value: crucible
          command:
            - /bin/sh
            - -c
            - |
              set -e

              echo "Waiting for Keycloak to be ready..."
              until curl -sfk "${KEYCLOAK_URL}/realms/master" > /dev/null 2>&1; do
                echo "Keycloak not ready, waiting 10 seconds..."
                sleep 10
              done
              echo "Keycloak is ready!"

              echo "Getting admin access token..."
              ACCESS_TOKEN=$(curl -sk -X POST \
                "${KEYCLOAK_URL}/realms/master/protocol/openid-connect/token" \
                -H "Content-Type: application/x-www-form-urlencoded" \
                -d "grant_type=password" \
                -d "client_id=admin-cli" \
                -d "username=${KEYCLOAK_ADMIN_USER}" \
                -d "password=${KEYCLOAK_ADMIN_PASSWORD}" | \
                grep -o '"access_token":"[^"]*' | \
                grep -o '[^"]*$')

              echo "Searching for existing user '${KEYCLOAK_CRUCIBLE_USERNAME}' by username..."
              USERS_JSON=$(curl -sk -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                "${KEYCLOAK_URL}/admin/realms/crucible/users?username=${KEYCLOAK_CRUCIBLE_USERNAME}")

              NOW_MS=$(( $(date +%s) * 1000 ))

              if echo "${USERS_JSON}" | grep -q '"id"'; then
                echo "User '${KEYCLOAK_CRUCIBLE_USERNAME}' already exists, skipping import."
              else
                echo "User '${KEYCLOAK_CRUCIBLE_USERNAME}' not found, importing now..."
                curl -k -X POST \
                  "${KEYCLOAK_URL}/admin/realms/crucible/partialImport" \
                  -H "Content-Type: application/json" \
                  -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                  -d '{
                    "users": [
                      {
                        "id": "'"${KEYCLOAK_CRUCIBLE_USER_GUID}"'",
                        "username": "crucible",
                        "email": "administrator@{{ .Values.global.domain }}",
                        "firstName": "Crucible",
                        "lastName": "Administrator",
                        "enabled": true,
                        "createdTimestamp": "'"${NOW_MS}"'",
                        "credentials": [
                          {
                            "type": "password",
                            "value": "crucible",
                            "userLabel": "initial",
                            "temporary": true
                          }
                        ],
                        "requiredActions":["UPDATE_PASSWORD"],
                        "realmRoles": ["crucible-admin"]
                      }
                    ]
                  }'
              fi
